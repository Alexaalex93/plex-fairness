services:
  plex-fairness-db:
    image: postgres:16-alpine
    container_name: plex-fairness-db
    environment:
      POSTGRES_DB: plexfair
      POSTGRES_USER: plexfair
      POSTGRES_PASSWORD: change_me
    volumes:
      - /mnt/user/appdata/plex-fairness/db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  plex-fairness-collector:
    image: ghcr.io/alexaalex93/plex-fairness:latest
    container_name: plex-fairness-collector
    runtime: nvidia
    # host network: needed to read the real NIC traffic and speed. The webhook listens on NAS_IP:8787
    network_mode: host
    environment:
      TAUTULLI_URL: http://192.168.1.10:8181
      TAUTULLI_APIKEY: put_your_api_key_here
      # with host network the db is reached through its published port
      PG_DSN: postgresql://plexfair:change_me@127.0.0.1:5433/plexfair
      POLL_SECONDS: "30"
      RETENTION_DAYS: "180"
      PATH_MAP_FROM: /media
      PATH_MAP_TO: /host_user/data/multimedia
      WAN_UP_MBPS: "10000"          # your internet upload, it can't be detected
      NVENC_SESSION_LIMIT: "8"      # consumer NVIDIA driver limit
      # NET_IFACE: br0              # only if the auto-detected interface is wrong
      # NIC_SPEED_MBPS: "10000"     # only if the auto-detected speed is wrong
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    volumes:
      - /mnt/user:/host_user:ro
      - /var/local/emhttp:/host_emhttp:ro
      - /dev/shm:/host_shm:ro                       # Plex transcodes here
      - /var/run/docker.sock:/var/run/docker.sock:ro  # CPU/RAM per container
    depends_on:
      - plex-fairness-db
    restart: unless-stopped

  plex-fairness-grafana:
    image: ghcr.io/alexaalex93/plex-fairness-grafana:latest
    container_name: plex-fairness-grafana
    environment:
      PLEXFAIR_DB_PASSWORD: change_me
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change_me_too
    volumes:
      - plex-fairness-grafana-data:/var/lib/grafana
    ports:
      - "6002:3000"
    depends_on:
      - plex-fairness-db
    restart: unless-stopped

volumes:
  plex-fairness-grafana-data:
